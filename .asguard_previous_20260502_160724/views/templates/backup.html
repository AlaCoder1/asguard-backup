{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
  {{ block.super }}
  {% for stylesheet in backup_assets.css %}
    <link rel="stylesheet" href="{{ stylesheet }}">
  {% endfor %}
{% endblock %}

{% block javascripts %}
  {% for script in backup_assets.js %}
    <script src="{{ script }}"></script>
  {% endfor %}
{% endblock %}

{% block body %}
  <div id="app"></div>
{% endblock %}
