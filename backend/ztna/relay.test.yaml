v: 3

identity:
  cert:             "/root/.ziti/quickstart/Asguard/relay.test.cert"
  server_cert:      "/root/.ziti/quickstart/Asguard/relay.test.server.chain.cert"
  key:              "/root/.ziti/quickstart/Asguard/relay.test.key"
  ca:               "/root/.ziti/quickstart/Asguard/relay.test.cas"
  #alt_server_certs:
  #  - server_cert:  ""
  #    server_key:   ""

ctrl:
  endpoint:             tls:Asguard:6262

link:
  dialers:
    - binding: transport
  listeners:
    - binding:          transport
      bind:             tls:0.0.0.0:10080
      advertise:        tls:Asguard:10080
      options:
        outQueueSize:   4

listeners:
# bindings of edge and tunnel requires an "edge" section below
  - binding: edge
    address: tls:0.0.0.0:3022
    options:
      advertise: Asguard:3022
      connectTimeoutMs: 5000
      getSessionTimeout: 60
  - binding: tunnel
    options:
      mode: host #tproxy|host


edge:
  csr:
    country: US
    province: NC
    locality: Charlotte
    organization: NetFoundry
    organizationalUnit: Ziti
    sans:
      dns:
        - localhost
        - Asguard

      ip:
        - "127.0.0.1"


#transport:
#  ws:
